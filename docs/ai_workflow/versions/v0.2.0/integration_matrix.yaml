version: v0.2.0
package: atpro
contracts:
  public_api: docs/contracts/public_api.md
  parser: docs/contracts/parser_contract.md
  cli: docs/contracts/cli_contract.md
  persistence: docs/contracts/persistence_contract.md
components:
  domain:
    status: planned
    public: true
    depends_on: []
  parser:
    status: planned
    public: true
    depends_on:
      - domain
  database:
    status: planned
    public: false
    depends_on:
      - domain
      - parser
  imports:
    status: planned
    public: true
    depends_on:
      - parser
      - database
  cli:
    status: planned
    public: true
    depends_on:
      - parser
      - imports
      - database
  api:
    status: out_of_scope
  frontend:
    status: out_of_scope
  reports:
    status: out_of_scope
quality:
  coverage_global: "95% unless changed by ADR"
  integration_tests: required_for_database
  pytest_warnings: forbidden
template_references_forbidden: true
