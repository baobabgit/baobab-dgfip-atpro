version: v0.1.0
package: atpro
integrations:
  domain:
    provides:
      - Site
      - Agent
      - AgentAlias
      - AgentSiteAssignment
      - Call
      - CallSegment
      - Ticket
      - AgentDailyActivity
    consumed_by:
      - parser
      - cli
  parser:
    provides:
      - FileInspection
      - ParseResult
      - ParsePreview
      - CSV readers
    consumed_by:
      - cli
      - future_api
      - future_worker
  cli:
    provides:
      - atpro file inspect
      - atpro file validate
      - atpro file preview
    consumes:
      - parser
      - domain
  reference_data:
    provides:
      - tests fixtures
      - optional real CSV validation
    consumes:
      - parser
status:
  postgres: out_of_scope
  fastapi: out_of_scope
  react: out_of_scope
  docker_app: out_of_scope
  quarkdown: out_of_scope
